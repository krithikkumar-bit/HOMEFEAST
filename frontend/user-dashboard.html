<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1">

<title>User Dashboard</title>

<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
rel="stylesheet">

</head>

<body class="bg-light">

<div class="container py-4">

<h2 class="mb-4">
User Dashboard
</h2>

<div class="row g-3 mb-4">

<div class="col-md-4">

<div class="card shadow-sm">
<div class="card-body">

<h6>
Active Subscriptions
</h6>

<h3 id="subCount">
0
</h3>

</div>
</div>

</div>

<div class="col-md-4">

<div class="card shadow-sm">
<div class="card-body">

<h6>
Orders
</h6>

<h3 id="orderCount">
0
</h3>

</div>
</div>

</div>

<div class="col-md-4">

<div class="card shadow-sm">
<div class="card-body">

<h6>
Complaints
</h6>

<h3 id="complaintCount">
0
</h3>

</div>
</div>

</div>

</div>


<!-- SUBSCRIPTIONS -->

<div class="card shadow-sm mb-4">

<div class="card-header">
My Subscriptions
</div>

<div class="card-body">

<table
class="table table-bordered">

<thead>

<tr>
<th>Plan</th>
<th>Amount</th>
<th>Status</th>
</tr>

</thead>

<tbody id="subsTable">
</tbody>

</table>

</div>
</div>


<!-- ORDERS -->

<div class="card shadow-sm mb-4">

<div class="card-header">
Order History
</div>

<div class="card-body">

<table
class="table table-striped">

<thead>

<tr>
<th>Total</th>
<th>Status</th>
</tr>

</thead>

<tbody id="ordersTable">
</tbody>

</table>

</div>
</div>


<!-- COMPLAINT FORM -->

<div class="card shadow-sm">

<div class="card-header">
Submit Complaint
</div>

<div class="card-body">

<input
id="subject"
class="form-control mb-2"
placeholder="Subject">

<textarea
id="message"
class="form-control mb-2"
placeholder="Complaint">
</textarea>

<button
class="btn btn-danger"
onclick="submitComplaint()">
Submit
</button>

</div>
</div>

</div>


<script>

const token =
localStorage.getItem(
'token'
);


// LOAD SUBSCRIPTIONS

async function loadSubs(){

const res =
await fetch(
'/api/subscriptions/my',
{
headers:{
Authorization:
`Bearer ${token}`
}
});

const data =
await res.json();

document.getElementById(
'subCount'
).innerText =
data.count;

const table =
document.getElementById(
'subsTable'
);

table.innerHTML='';

data.data.forEach(sub=>{

table.innerHTML+=`

<tr>

<td>
${sub.plan}
</td>

<td>
₹${sub.amount}
</td>

<td>
${sub.status}
</td>

</tr>

`;

});

}


// LOAD ORDERS

async function loadOrders(){

const res =
await fetch(
'/api/orders/my',
{
headers:{
Authorization:
`Bearer ${token}`
}
});

const data =
await res.json();

document.getElementById(
'orderCount'
).innerText =
data.count;

const table =
document.getElementById(
'ordersTable'
);

table.innerHTML='';

data.data.forEach(order=>{

table.innerHTML+=`

<tr>

<td>
₹${order.totalPrice}
</td>

<td>
${order.status}
</td>

</tr>

`;

});

}


// LOAD COMPLAINTS

async function loadComplaints(){

const res =
await fetch(
'/api/complaints/my',
{
headers:{
Authorization:
`Bearer ${token}`
}
});

const data =
await res.json();

document.getElementById(
'complaintCount'
).innerText =
data.count;

}


// SUBMIT COMPLAINT

async function submitComplaint(){

const subject =
document.getElementById(
'subject'
).value;

const message =
document.getElementById(
'message'
).value;

await fetch(
'/api/complaints',
{
method:'POST',

headers:{
'Content-Type':
'application/json',

Authorization:
`Bearer ${token}`
},

body:JSON.stringify({
subject,
message
})
});

alert(
'Complaint Submitted'
);

loadComplaints();
}


loadSubs();
loadOrders();
loadComplaints();

</script>

</body>
</html>
